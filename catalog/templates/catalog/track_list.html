{% extends "catalog/base.html" %}

{% block title %}Tracks - Music Tracker{% endblock %}

{% block content %}
<h1>Tracks</h1>

<form method="get" class="search-form">
    <input type="text" name="q" placeholder="Search tracks..." value="{{ query }}">
    <button type="submit">Search</button>
</form>

<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Artist</th>
            <th>Album</th>
            <th>Popularity</th>
        </tr>
    </thead>
    <tbody id="tracks-table-body">
        <tr>
            <td colspan="4">Loading...</td>
        </tr>
    </tbody>
</table>
{% endblock %}
